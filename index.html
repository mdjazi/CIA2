<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA SYSTEM | نظام التحكم والاستخبارات الفدرالي</title>
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة html2canvas لحفظ التقارير كصور -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #00ff66;
            --bg-dark: #0d1117;
            --panel-bg: rgba(13, 17, 23, 0.85);
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --danger-color: #ff3333;
            --edit-color: #3399ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* خلفية السيبر كانفاس */
        #cyber-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        /* تنسيق كارد التقرير */
        .report-card {
            background: #161b22;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            position: relative;
        }

        .report-header {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .report-body {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* شريط أزرار التحكم بالتقرير */
        .report-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .report-actions button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit { color: var(--edit-color); border-color: var(--edit-color); }
        .btn-edit:hover { background: var(--edit-color); color: #fff; }

        .btn-save-img { color: var(--primary-color); border-color: var(--primary-color); }
        .btn-save-img:hover { background: var(--primary-color); color: #000; }

        .btn-delete { color: var(--danger-color); border-color: var(--danger-color); }
        .btn-delete:hover { background: var(--danger-color); color: #fff; }
    </style>
</head>
<body>

    <!-- خلفية تأثيرات بصرية -->
    <canvas id="cyber-canvas"></canvas>

    <div class="container">
        <h2><i class="fas fa-shield-alt"></i> سجل تقارير الاستخبارات</h2>
        
        <!-- حاوية التقارير -->
        <div id="reports-container">
            <!-- مثال لتقرير تم توليده ديناميكياً -->
            <div class="report-card" id="report-101">
                <div class="report-header">تقرير استخباراتي #101 - عملية الرصد الميداني</div>
                <div class="report-body">
                    تم رصد تحركات مشبوهة في القطاع رقم 7. جارٍ تحليل البيانات الواردة من الأقمار الصناعية وتأكيد إحداثيات الهدف بدقة عالية. الحالة: نشط وعاجل.
                </div>
                <div class="report-actions">
                    <button class="btn-edit" onclick="editReport(101)" title="تعديل التقرير">
                        <i class="fas fa-edit"></i> تعديل
                    </button>
                    <button class="btn-save-img" onclick="saveReportAsImage('report-101')" title="حفظ كصورة">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                    <button class="btn-delete" onclick="deleteReport(101)" title="حذف التقرير">
                        <i class="fas fa-trash"></i> حذف
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // تأثير الخلفية البسيطة (Cyber Canvas)
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        chars = chars.split("");
        let fontSize = 14;
        let columns = window.innerWidth / fontSize;
        let drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(13, 17, 23, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff66";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                let text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // دالة حفظ التقرير كصورة باستخدام مكتبة html2canvas
        function saveReportAsImage(reportElementId) {
            const reportElement = document.getElementById(reportElementId);
            
            if (!reportElement) {
                alert("عنصر التقرير غير موجود!");
                return;
            }

            // التقاط العنصر وتحويله إلى صورة
            html2canvas(reportElement, {
                backgroundColor: '#161b22', // لون خلفية الكارد ليتطابق مع التصميم
                scale: 2 // لرفع جودة ودقة الصورة الناتجة
            }).then(canvas => {
                const imageURL = canvas.toDataURL("image/png");
                
                // إنشاء رابط تحميل وهمي وتفعيله تلقائياً
                const downloadLink = document.createElement('a');
                downloadLink.href = imageURL;
                downloadLink.download = `CIA_Report_${reportElementId}_${Date.now()}.png`;
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            }).catch(error => {
                console.error("حدث خطأ أثناء حفظ التقرير كصورة:", error);
                alert("فشل حفظ التقرير كصورة.");
            });
        }

        // دوال وهمية للتعديل والحذف (يمكن ربطها بالنظام لديك)
        function editReport(id) {
            alert("تعديل التقرير رقم: " + id);
        }

        function deleteReport(id) {
            if(confirm("هل أنت متأكد من حذف هذا التقرير؟")) {
                document.getElementById('report-' + id).remove();
            }
        }
    </script>
</body>
</html>
