<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIA SYSTEM | نظام التحكم والاستخبارات الفدرالي</title>

  <style>
    /* =========================================================
       1. الخلفية العامة الموحدة والتنسيقات الأساسية
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05080c;
      color: #00ffcc;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* خلفية الماتريكس المتحركة الموحدة للجميع */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      opacity: 0.15;
      pointer-events: none;
    }

    /* الشعار المائي بالخلفية - تم تغميقه وجعله احترافياً */
    .watermark-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      opacity: 0.05; /* شعار غامق خفيف جداً وعالي الفخامة */
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 15px #00ffcc);
    }

    /* حاوية المحتوى الرئيسي فوق الخلفيات */
    .app-container {
      position: relative;
      z-index: 3;
      padding: 20px;
      min-height: 100vh;
    }

    /* =========================================================
       2. قسم التشفير وفك التشفير الجديد (جهاز تشفير سيبراني)
       ========================================================= */
    #decryptionSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* جهاز التشفير الرقمي المتحرك */
    .cyber-decoder-machine {
      position: relative;
      width: 100%;
      max-width: 650px;
      background: linear-gradient(145deg, #0d1520, #050a10);
      border: 2px solid #00ffcc;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
      overflow: hidden;
    }

    /* تأثيرات الخطوط والمسمارات للجهاز */
    .cyber-decoder-machine::before {
      content: 'CIA ENCRYPTION UNIT // MODEL-X';
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 10px;
      color: rgba(0, 255, 204, 0.5);
      letter-spacing: 2px;
    }

    /* أنيميشن الماسح الضوئي للجهاز */
    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(0, 255, 204, 0.8);
      box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
      animation: scan 4s infinite linear;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }

    .decoder-title {
      text-align: center;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    /* حقل الإدخال الرقمي داخل الجهاز */
    .cyber-input {
      width: 100%;
      height: 120px;
      background: rgba(2, 12, 20, 0.85);
      border: 1px solid #00ffcc;
      border-radius: 8px;
      color: #00ffcc;
      padding: 15px;
      font-size: 1rem;
      outline: none;
      resize: none;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
    }

    .cyber-input::placeholder {
      color: rgba(0, 255, 204, 0.4);
    }

    /* أزرار التشغيل */
    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .cyber-btn {
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 12px 25px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
      text-shadow: 0 0 5px #00ffcc;
    }

    .cyber-btn:hover {
      background: #00ffcc;
      color: #05080c;
      box-shadow: 0 0 15px #00ffcc;
    }

    /* =========================================================
       3. شاشة التحميل وفك التشفير التفاعلية (3 ثوانٍ)
       ========================================================= */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 12, 0.95);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cyber-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 255, 204, 0.1);
      border-left-color: #00ffcc;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.1rem;
      letter-spacing: 2px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .result-box {
      margin-top: 20px;
      width: 100%;
      background: rgba(0, 255, 204, 0.05);
      border: 1px dashed #00ffcc;
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      min-height: 50px;
    }
  </style>
</head>
<body>

  <!-- خلفية الشعار المائي المظلم -->
  <svg class="watermark-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#00ffcc" stroke-width="3"/>
    <path d="M100 20 L120 70 L170 70 L130 100 L150 150 L100 120 L50 150 L70 100 L30 70 L80 70 Z" fill="none" stroke="#00ffcc" stroke-width="2"/>
  </svg>

  <!-- خلفية الماتريكس التفاعلية -->
  <canvas id="matrix-canvas"></canvas>

  <div class="app-container">

    <!-- قسم التشفير وفك التشفير مطور -->
    <section id="decryptionSection">
      <div class="cyber-decoder-machine">
        <div class="scanner-line"></div>
        <h2 class="decoder-title">🔒 وحدة التشفير وفك التشفير الفدرالية</h2>

        <!-- منطقة إدخال البيانات المدمجة داخل الجهاز -->
        <textarea id="cipherInput" class="cyber-input" placeholder="أدخل النص أو الشفرة هنا للبدء بالعملية..."></textarea>

        <div class="btn-group">
          <button class="cyber-btn" onclick="processCipher('encode')">تشفير البيانات</button>
          <button class="cyber-btn" onclick="processCipher('decode')">فك التشفير</button>
        </div>

        <div id="resultBox" class="result-box">النتائج ستظهر هنا بعد معالجة الشفرة...</div>

        <!-- شاشه التحميل المنتظرة 3 ثوانٍ -->
        <div id="loadingOverlay" class="loading-overlay">
          <div class="cyber-spinner"></div>
          <div class="loading-text" id="loadingText">جاري التشفير واختراق الحزم... [00:03]</div>
        </div>
      </div>
    </section>

  </div>

  <script>
    /* =========================================================
       1. إعداد خلفية الماتريكس
       ========================================================= */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ01';
    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 8, 12, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ffcc';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    /* =========================================================
       2. محاكاة أصوات الراديو والبرمجيات (Web Audio API)
       ========================================================= */
    let audioCtx = null;
    let radioNoiseNode = null;

    function initCyberAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      // صوت طنين برمجيات خفيف (Ambient Beep / Data hum)
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime); // تردد منخفض
      gain.gain.setValueAtTime(0.015, audioCtx.currentTime);   // صوت خفيف جداً
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();

      // أصوات تشويش راديو العمليات (Radio Chatter / Static)
      createRadioStatic();
    }

    function createRadioStatic() {
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      radioNoiseNode = audioCtx.createBufferSource();
      radioNoiseNode.buffer = noiseBuffer;
      radioNoiseNode.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000; // ضبط الصوت كأنه راديو إرسال
      filter.Q.value = 3.0;

      const radioGain = audioCtx.createGain();
      radioGain.gain.setValueAtTime(0.008, audioCtx.currentTime); // خفيف وواقعي

      radioNoiseNode.connect(filter);
      filter.connect(radioGain);
      radioGain.connect(audioCtx.destination);
      radioNoiseNode.start();
    }

    // تشغيل الصوت مباشرة عند أول تفاعل
    window.addEventListener('click', () => {
      if (!audioCtx) initCyberAudio();
    }, { once: true });

    /* =========================================================
       3. منطق التشفير/فك التشفير مع مهلة الـ 3 ثوانٍ
       ========================================================= */
    function processCipher(mode) {
      const input = document.getElementById('cipherInput').value;
      if (!input.trim()) {
        alert('يرجى إدخال نص أولاً!');
        return;
      }

      if (!audioCtx) initCyberAudio();

      const overlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');
      const resultBox = document.getElementById('resultBox');

      overlay.style.display = 'flex';
      let secondsLeft = 3;

      loadingText.innerText = mode === 'encode' 
        ? `جاري تشفير البيانات وتنسيق الحزم... [00:0${secondsLeft}]` 
        : `جاري فك التشفير واختراق البروتوكول... [00:0${secondsLeft}]`;

      // أصوات نقرات برمجية أثناء التحميل
      const interval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          loadingText.innerText = mode === 'encode' 
            ? `جاري تشفير البيانات وتنسيق الحزم... [00:0${secondsLeft}]` 
            : `جاري فك التشفير واختراق البروتوكول... [00:0${secondsLeft}]`;
          playCyberBeep();
        } else {
          clearInterval(interval);
          overlay.style.display = 'none';

          // النتيجة النهائية
          if (mode === 'encode') {
            resultBox.innerText = "النص المشفر: " + btoa(unescape(encodeURIComponent(input)));
          } else {
            try {
              resultBox.innerText = "النص الأصلي: " + decodeURIComponent(escape(atob(input)));
            } catch (e) {
              resultBox.innerText = "⚠️ خطأ: الشفرة غير صالحة أو معطوبة!";
            }
          }
        }
      }, 1000);
    }

    // صوت Beep للبرمجيات أثناء فك الشفرة
    function playCyberBeep() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }
  </script>
</body>
</html>
