            display: none; justify-content: center; align-items: center; z-index: 100; box-shadow: 0 0 10px rgba(217,4,41,0.8);
        }
        .selected-element .node-delete-btn { display: flex; }
        
        .node-resize-handle-right, .node-resize-handle-bottom, .node-resize-handle-corner { position: absolute; display: none; z-index: 50; }
        .node-resize-handle-right { right: 0; top: 50%; transform: translateY(-50%); width: 8px; height: 100%; cursor: ew-resize; }
        .node-resize-handle-bottom { bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 8px; cursor: ns-resize; }
        .node-resize-handle-corner { right: 0; bottom: 0; width: 14px; height: 14px; background: var(--gold-color); cursor: nwse-resize; border: 1px solid #fff; }
        .selected-element .node-resize-handle-right, .selected-element .node-resize-handle-bottom, .selected-element .node-resize-handle-corner { display: block; }
        
        .btn-action { background: var(--success-color); color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px; }
        /* ======================================================== */
    </style>
</head>
<body>

    <!-- بقية عناصر النظام واللوحات الأساسية تظل هنا كما هي بدون تغيير -->

    <!-- شاشة الشجرة التنظيمية الجديدة -->
    <div class="gang-fullscreen-overlay" id="gangTreeOverlay" style="display:none;">
        <div class="gang-fullscreen-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <span style="font-size:20px;">🏴‍☠️</span>
                <input type="text" id="gangTitle" value="شجرة الهيكل التنظيمي" style="background: rgba(4, 6, 10, 0.9); border: 1px solid var(--gold-color); color: var(--gold-color); font-size: 15px; font-weight: bold; padding: 4px 10px; border-radius: 6px; width: 200px; outline:none;">
            </div>
            <button class="btn-action" onclick="alert('تم الحفظ بنجاح!')">💾 حفظ التغييرات</button>
        </div>
        <div class="gang-editor-layout">
            <div class="gang-sidebar">
                <h5 style="color: var(--gold-color); font-size: 11px; margin-bottom: 2px;">📦 أدوات الرسم</h5>
                <button class="drawio-tool-btn" id="btnSpawnRect" onclick="activateDrawingMode('rect', 'مستطيل جديد')">▭ إنشاء مستطيل (سحب)</button>
                <button class="drawio-tool-btn" id="btnSpawnCircle" onclick="activateDrawingMode('circle', 'دائرة جديدة')">⭕ إنشاء دائرة (سحب)</button>
                <button class="drawio-tool-btn" id="btnSpawnText" onclick="activateDrawingMode('text', 'ملاحظة نصية...')">💬 إنشاء نص حر (سحب)</button>
                <button class="drawio-tool-btn" id="btnSpawnLine" onclick="activateDrawingMode('line', '')">➖ خط منفصل (سحب)</button>
                <button class="drawio-tool-btn" id="btnLinkNodes" style="background:rgba(0, 132, 255, 0.25); border-color:#0084ff; color:#38bdf8;" onclick="toggleLinkingMode()">🔗 ربط عنصرين</button>
                <hr style="border: 0; border-top: 1px dashed rgba(197, 160, 89, 0.4); margin: 4px 0;">
                <div style="font-size: 9px; color: var(--text-muted); line-height: 1.3;">💡 انقر على العنصر وحدده ثم اضغط <b>Delete</b> من الكيبورد للحذف.</div>
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="zoom-lens-bar-external">
                    <span style="color:var(--gold-color); font-size:11px; font-weight:bold; margin-left:auto;">مستوى العرض:</span>
                    <button class="zoom-lens-btn" onclick="zoomCanvas(-0.1)">➖</button>
                    <span class="zoom-level-lbl" id="zoomLevelLbl">100%</span>
                    <button class="zoom-lens-btn" onclick="zoomCanvas(0.1)">➕</button>
                    <button class="zoom-lens-btn" onclick="resetZoom()">🔍</button>
                </div>
                <div class="gang-canvas-area" id="gangCanvasArea">
                    <div class="gang-canvas-inner-world" id="gangCanvasInnerWorld">
                        <svg class="connected-svg-line" id="svgCanvas"></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedElementForDeletion = null;
        let isLinkingMode = false, linkSourceNodeId = null, connectedLinks = [];
        let currentZoomScale = 1.0, activeDrawingType = null, defaultDrawingText = '';
        let isDrawingBox = false, drawStartX = 0, drawStartY = 0, previewBoxElement = null;
        const canvasArea = document.getElementById("gangCanvasArea");
        const canvasInnerWorld = document.getElementById("gangCanvasInnerWorld");
        let isRightMouseDown = false, rightMouseStartX = 0, rightMouseStartY = 0;

        // تشغيل محرك السحب والإنشاء
        if (canvasArea) {
            canvasArea.addEventListener('mousedown', (e) => {
                if (e.target === canvasArea || e.target === canvasInnerWorld || e.target.id === 'svgCanvas') {
                    document.querySelectorAll('.selected-element').forEach(n => n.classList.remove('selected-element'));
                    selectedElementForDeletion = null;
                }
                if (e.button === 2) { 
                    isRightMouseDown = true; rightMouseStartX = e.clientX + canvasArea.scrollLeft; rightMouseStartY = e.clientY + canvasArea.scrollTop; e.preventDefault();
                } else if (e.button === 0 && activeDrawingType) {
                    isDrawingBox = true;
                    const rect = canvasInnerWorld.getBoundingClientRect();
                    drawStartX = (e.clientX - rect.left) / currentZoomScale;
                    drawStartY = (e.clientY - rect.top) / currentZoomScale;
                    previewBoxElement = document.createElement('div');
                    previewBoxElement.style.position = 'absolute';
                    previewBoxElement.style.left = drawStartX + 'px';
                    previewBoxElement.style.top = drawStartY + 'px';
                    previewBoxElement.style.width = '0px';
                    previewBoxElement.style.height = '0px';
                    previewBoxElement.style.border = '2px dashed #10b981';
                    previewBoxElement.style.background = 'rgba(16, 185, 129, 0.15)';
                    previewBoxElement.style.borderRadius = (activeDrawingType === 'circle') ? '50%' : '6px';
                    previewBoxElement.style.zIndex = '5000';
                    canvasInnerWorld.appendChild(previewBoxElement);
                    e.preventDefault();
                }
            });
            window.addEventListener('mousemove', (e) => {
                if (isRightMouseDown) {
                    canvasArea.scrollLeft = rightMouseStartX - e.clientX;
                    canvasArea.scrollTop = rightMouseStartY - e.clientY;
                } else if (isDrawingBox && previewBoxElement) {
                    const rect = canvasInnerWorld.getBoundingClientRect();
                    const curX = (e.clientX - rect.left) / currentZoomScale;
                    const curY = (e.clientY - rect.top) / currentZoomScale;
                    const w = Math.abs(curX - drawStartX);
                    const h = Math.abs(curY - drawStartY);
                    const l = Math.min(curX, drawStartX);
                    const t = Math.min(curY, drawStartY);
                    previewBoxElement.style.left = l + 'px';
                    previewBoxElement.style.top = t + 'px';
                    previewBoxElement.style.width = Math.max(60, w) + 'px';
                    previewBoxElement.style.height = Math.max(50, h) + 'px';
                }
            });
            window.addEventListener('mouseup', (e) => {
                if (e.button === 2) isRightMouseDown = false;
                else if (isDrawingBox && previewBoxElement) {
                    isDrawingBox = false;
                    const finalLeft = parseInt(previewBoxElement.style.left);
                    const finalTop = parseInt(previewBoxElement.style.top);
                    const finalWidth = parseInt(previewBoxElement.style.width);
                    const finalHeight = parseInt(previewBoxElement.style.height);
                    previewBoxElement.remove(); previewBoxElement = null;
                    
                    const nodeData = {
                        id: 'node_' + Date.now() + Math.floor(Math.random()*10000),
                        type: activeDrawingType,
                        text: (activeDrawingType === 'line') ? '' : defaultDrawingText,
                        x: finalLeft, y: finalTop, width: finalWidth, height: finalHeight
                    };
                    renderNodeElement(nodeData);
                    resetDrawingMode();
                }
            });
            canvasArea.addEventListener('contextmenu', e => e.preventDefault());
            canvasArea.addEventListener('wheel', e => { e.preventDefault(); zoomCanvas(e.deltaY < 0 ? 0.1 : -0.1); }, { passive: false });
        }

        function activateDrawingMode(type, defaultText) {
            activeDrawingType = type; defaultDrawingText = defaultText; isLinkingMode = false;
            document.querySelectorAll('.drawio-tool-btn').forEach(b => b.classList.remove('active-drawing', 'active-linking'));
            let btnId = type === 'circle' ? 'btnSpawnCircle' : (type === 'text' ? 'btnSpawnText' : (type === 'line' ? 'btnSpawnLine' : 'btnSpawnRect'));
            const btn = document.getElementById(btnId);
            if (btn) { btn.classList.add('active-drawing'); btn.innerText = "🎯 ارسم بالماوس الآن..."; }
        }
        function resetDrawingMode() {
            document.querySelectorAll('.drawio-tool-btn').forEach(b => b.classList.remove('active-drawing'));
            document.getElementById('btnSpawnRect').innerText = "▭ إنشاء مستطيل (سحب)";
            document.getElementById('btnSpawnCircle').innerText = "⭕ إنشاء دائرة (سحب)";
            document.getElementById('btnSpawnText').innerText = "💬 إنشاء نص حر (سحب)";
            document.getElementById('btnSpawnLine').innerText = "➖ خط منفصل (سحب)";
            activeDrawingType = null;
        }

        // تفعيل الحذف باستخدام زر Delete من الكيبورد
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Delete') {
                if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.classList.contains('node-content-editable'))) {
                    return;
                }
                if (selectedElementForDeletion && document.body.contains(selectedElementForDeletion)) {
                    const deletedId = selectedElementForDeletion.getAttribute('data-id');
                    deleteNodeElement(deletedId, null);
                    e.preventDefault();
                }
            }
        });

        function renderNodeElement(nodeData) {
            const world = document.getElementById("gangCanvasInnerWorld");
            if (!world) return;
            const el = document.createElement('div');
            el.setAttribute('data-id', nodeData.id);
            
            if (nodeData.type === 'circle') el.className = 'draggable-node node-circle';
            else if (nodeData.type === 'text') el.className = 'draggable-node node-text';
            else if (nodeData.type === 'line') el.className = 'node-line';
            else el.className = 'draggable-node';
            
            el.style.left = nodeData.x + 'px';
            el.style.top = nodeData.y + 'px';
            if (nodeData.width) el.style.width = nodeData.width + 'px';
            if (nodeData.height) el.style.height = nodeData.height + 'px';
            
            const delBtn = `<div class="node-delete-btn" title="حذف" onclick="deleteNodeElement('${nodeData.id}', event)">✕</div>`;
            el.innerHTML = `${delBtn}<div class="node-content-editable" contenteditable="true">${nodeData.text || ''}</div><div class="node-resize-handle-right"></div><div class="node-resize-handle-bottom"></div><div class="node-resize-handle-corner"></div>`;
            
            setupNodeInteractions(el);
            world.appendChild(el);
            updateConnectedSvgLines();
        }

        function deleteNodeElement(id, e) {
            const el = document.querySelector(`[data-id="${id}"]`);
            if (el) {
                connectedLinks = connectedLinks.filter(l => l.from !== id && l.to !== id);
                el.remove(); selectedElementForDeletion = null; updateConnectedSvgLines();
            }
            if (e) e.stopPropagation();
        }

        function setupNodeInteractions(el) {
            el.addEventListener('mousedown', (e) => {
                if (e.button === 2) return;
                if (isLinkingMode) {
                    const id = el.getAttribute('data-id');
                    if (!linkSourceNodeId) { linkSourceNodeId = id; el.classList.add('selected-element'); }
                    else if (linkSourceNodeId !== id) {
                        connectedLinks.push({ from: linkSourceNodeId, to: id });
                        linkSourceNodeId = null; isLinkingMode = false;
                        document.getElementById("btnLinkNodes").classList.remove("active-linking");
                        document.getElementById("btnLinkNodes").innerText = "🔗 ربط عنصرين";
                        document.querySelectorAll('.selected-element').forEach(n => n.classList.remove('selected-element'));
                        updateConnectedSvgLines();
                    }
                    e.stopPropagation(); return;
                }
                
                document.querySelectorAll('.draggable-node, .node-line').forEach(n => n.classList.remove('selected-element'));
                el.classList.add('selected-element');
                selectedElementForDeletion = el;
                
                const isResizeR = e.target.classList.contains('node-resize-handle-right');
                const isResizeB = e.target.classList.contains('node-resize-handle-bottom');
                const isResizeC = e.target.classList.contains('node-resize-handle-corner');
                
                const startX = e.clientX, startY = e.clientY;
                const origLeft = el.offsetLeft, origTop = el.offsetTop, origW = el.offsetWidth, origH = el.offsetHeight;
                
                function onMouseMove(me) {
                    const dx = (me.clientX - startX) / currentZoomScale;
                    const dy = (me.clientY - startY) / currentZoomScale;
                    if (isResizeR) el.style.width = Math.max(60, origW + dx) + 'px';
                    else if (isResizeB) el.style.height = Math.max(50, origH + dy) + 'px';
                    else if (isResizeC) { el.style.width = Math.max(60, origW + dx) + 'px'; el.style.height = Math.max(50, origH + dy) + 'px'; }
                    else { el.style.left = (origLeft + dx) + 'px'; el.style.top = (origTop + dy) + 'px'; }
                    updateConnectedSvgLines();
                }
                function onMouseUp() { window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp); }
                window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
                e.stopPropagation();
            });
        }

        function toggleLinkingMode() {
            isLinkingMode = !isLinkingMode; linkSourceNodeId = null;
            const btn = document.getElementById("btnLinkNodes");
            if (isLinkingMode) { btn.classList.add("active-linking"); btn.innerText = "🎯 اختر العنصر الأول..."; }
            else { btn.classList.remove("active-linking"); btn.innerText = "🔗 ربط عنصرين"; }
        }

        function updateConnectedSvgLines() {
            const svg = document.getElementById("svgCanvas");
            if (!svg) return;
            svg.innerHTML = "";
            connectedLinks.forEach((link, idx) => {
                const f = document.querySelector(`[data-id="${link.from}"]`);
                const t = document.querySelector(`[data-id="${link.to}"]`);
                if (f && t) {
                    const x1 = f.offsetLeft + f.offsetWidth / 2, y1 = f.offsetTop + f.offsetHeight / 2;
                    const x2 = t.offsetLeft + t.offsetWidth / 2, y2 = t.offsetTop + t.offsetHeight / 2;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.addEventListener('click', (e) => { connectedLinks.splice(idx, 1); updateConnectedSvgLines(); e.stopPropagation(); });
                    svg.appendChild(line);
                }
            });
        }

        function zoomCanvas(d) { currentZoomScale = Math.min(2.0, Math.max(0.3, currentZoomScale + d)); updateZoomDisplay(); }
        function resetZoom() { currentZoomScale = 1.0; updateZoomDisplay(); }
        function updateZoomDisplay() {
            if (canvasInnerWorld) canvasInnerWorld.style.transform = `scale(${currentZoomScale})`;
            const lbl = document.getElementById("zoomLevelLbl");
            if (lbl) lbl.innerText = Math.round(currentZoomScale * 100) + '%';
        }
    </script>
</body>
</html>
