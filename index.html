<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA CENTRAL SYSTEM</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #00ffcc;
            --bg-color: #050b14;
            --panel-bg: rgba(10, 25, 47, 0.85);
            --border-color: rgba(0, 255, 204, 0.3);
            --text-color: #e6f1ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* خلفية الماتريكس/البرمجة */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }

        /* شاشة التحميل - بدون شعار */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loader-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            transition: width 0.1s linear;
        }

        /* شاشة الدخول */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(5px);
        }

        .login-card img {
            width: 100px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            border-radius: 4px;
            outline: none;
            text-align: center;
        }

        .btn {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            width: 100%;
            font-weight: bold;
        }

        .btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* الواجهة الرئيسية */
        #mainApp {
            display: none;
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        /* شريط الملاحة والتنقل العلوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 25px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* أزرار الأسهم والبيت بنفس اللون وبدون نص */
        .icon-nav-btn {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            width: 42px;
            height: 42px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .icon-nav-btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* شبكة المجلدات */
        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .folder-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px var(--border-color);
            border-color: var(--primary-color);
        }

        .folder-card i {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        /* واجهة عرض المجلد الداخلي */
        #folderView {
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
        }

        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .btn-create {
            width: auto;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* النوافذ المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--primary-color);
            padding: 30px;
            border-radius: 8px;
            width: 450px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .close-btn {
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- خلفية البرمجة (Matrix Rain) -->
    <canvas id="matrixCanvas"></canvas>

    <!-- 1. شاشة التحميل (بدون شعار - فقط خلفية برمجة ومؤشر تقدم) -->
    <div id="splashScreen">
        <h2 style="color: var(--primary-color); letter-spacing: 2px;">INITIALIZING SYSTEM...</h2>
        <div class="loader-bar">
            <div class="loader-progress" id="loaderProgress"></div>
        </div>
    </div>

    <!-- 2. شاشة الدخول -->
    <div id="loginScreen" style="display: none;">
        <div class="login-card">
            <img src="https://i.ibb.co/L5QG2Q5/CIA-Logo.png" alt="CIA Logo">
            <h3 style="margin-bottom: 20px; color: var(--primary-color);">SYSTEM ACCESS</h3>
            <div class="input-group">
                <input type="text" placeholder="USERNAME">
            </div>
            <div class="input-group">
                <input type="password" placeholder="PASSCODE">
            </div>
            <button class="btn" onclick="login()">LOGIN</button>
        </div>
    </div>

    <!-- 3. التطبيق الرئيسي -->
    <div id="mainApp">
        <!-- شريط الملاحة -->
        <div class="top-nav">
            <div class="nav-controls">
                <!-- زر رجوع خطوة للخلف (سهم فقط) -->
                <button class="icon-nav-btn" onclick="goBack()" title="رجوع للخلف">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <!-- زر الصفحة الرئيسية (بيت فقط وبنفس اللون) -->
                <button class="icon-nav-btn" onclick="goHome()" title="الصفحة الرئيسية">
                    <i class="fas fa-home"></i>
                </button>
            </div>
            <div style="font-weight: bold; color: var(--primary-color);">CIA SYSTEM // AUTHORIZED ACCESS ONLY</div>
        </div>

        <!-- شبكة المجلدات الرئيسية -->
        <div id="homeView" class="folders-grid">
            <div class="folder-card" onclick="openFolder('REPORTS')">
                <i class="fas fa-folder-open"></i>
                <h3>REPORTS</h3>
            </div>
            <div class="folder-card" onclick="openFolder('WANTED')">
                <i class="fas fa-user-ninja"></i>
                <h3>WANTED</h3>
            </div>
            <div class="folder-card" onclick="openFolder('RECORDS')">
                <i class="fas fa-id-card"></i>
                <h3>RECORDS</h3>
            </div>
            <div class="folder-card" onclick="openFolder('INTELLIGENCE')">
                <i class="fas fa-sitemap"></i>
                <h3>INTELLIGENCE</h3>
            </div>
        </div>

        <!-- عرض المجلد الداخلي -->
        <div id="folderView">
            <div class="folder-header">
                <h2 id="folderTitle" style="color: var(--primary-color);">اسم المجلد</h2>
                <!-- زر إنشاء القائمة داخل المجلد -->
                <button class="btn btn-create" onclick="openCreateModal()">
                    <i class="fas fa-plus"></i> إنشاء
                </button>
            </div>
            <div id="folderContent">
                <p>لا توجد عناصر حالياً...</p>
            </div>
        </div>
    </div>

    <!-- النافذة المنبثقة لـ (إنشاء) -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: var(--primary-color);">إنشاء عنصر جديد</h3>
                <span class="close-btn" onclick="closeCreateModal()">&times;</span>
            </div>
            <form onsubmit="handleCreate(event)">
                <div class="input-group">
                    <input type="text" id="createTitle" placeholder="العنوان / الاسم" required>
                </div>
                <div class="input-group">
                    <textarea id="createDetails" placeholder="التفاصيل والمعلومات..." required></textarea>
                </div>
                <button type="submit" class="btn">حفظ وإنشاء</button>
            </form>
        </div>
    </div>

    <script>
        // خلفية الماتريكس (البرمجة)
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZCIA';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 11, 20, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffcc';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // محاكاة شاشة التحميل
        let progress = 0;
        const progressBar = document.getElementById('loaderProgress');
        const interval = setInterval(() => {
            progress += 5;
            progressBar.style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
                document.getElementById('splashScreen').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'flex';
            }
        }, 100);

        // تسجيل الدخول
        function login() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        // التنقل بين الشاشات والمجلدات
        let currentFolder = '';

        function openFolder(folderName) {
            currentFolder = folderName;
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('folderView').style.display = 'block';
            document.getElementById('folderTitle').innerText = 'مجلد // ' + folderName;
        }

        function goHome() {
            document.getElementById('folderView').style.display = 'none';
            document.getElementById('homeView').style.display = 'grid';
        }

        function goBack() {
            if (document.getElementById('folderView').style.display === 'block') {
                goHome();
            }
        }

        // نوافذ الإنشاء
        function openCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }

        function handleCreate(e) {
            e.preventDefault();
            const title = document.getElementById('createTitle').value;
            const details = document.getElementById('createDetails').value;

            const folderContent = document.getElementById('folderContent');
            if (folderContent.querySelector('p')) {
                folderContent.innerHTML = '';
            }

            const itemCard = document.createElement('div');
            itemCard.style.cssText = 'background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 15px; margin-bottom: 10px; border-radius: 4px;';
            itemCard.innerHTML = `<h4 style="color: var(--primary-color);">${title}</h4><p style="margin-top: 5px; font-size: 14px;">${details}</p>`;
            
            folderContent.appendChild(itemCard);

            // تفريغ الحقول وإغلاق النافذة
            document.getElementById('createTitle').value = '';
            document.getElementById('createDetails').value = '';
            closeCreateModal();
        }
    </script>
</body>
</html>
